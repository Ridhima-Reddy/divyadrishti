<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DivyaDrishti Optometrist Bridge</title>
  <meta name="theme-color" content="#f6f1ec">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/portal.css">
</head>
<body class="portal">
  <div class="shell">
    <aside class="sidenav">
      <a href="portal.html" class="brand">
        <svg class="mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect width="32" height="32" rx="10" fill="currentColor"/><path d="M5.5 16c2.9-4.7 6.4-7 10.5-7s7.6 2.3 10.5 7c-2.9 4.7-6.4 7-10.5 7s-7.6-2.3-10.5-7z" fill="none" stroke="#fff" stroke-width="1.9"/><circle cx="16" cy="16" r="3.4" fill="#fff"/></svg>
        <span>DivyaDrishti <em>Optometrist Bridge</em></span>
      </a>
      <nav class="navlist" aria-label="Portal">
        <button class="navitem on" data-tab="dash" data-icon="home"><span>Dashboard</span></button>
        <button class="navitem" data-tab="queue" data-icon="users"><span>Patients</span><b class="count" id="navOpen" hidden></b></button>
        <button class="navitem" data-tab="planning" data-icon="chart"><span>Camp planning</span></button>
        <button class="navitem" data-tab="rules" data-icon="rules"><span>Referral rules</span><b class="count soft" id="navRules" hidden></b></button>
      </nav>
      <button class="navitem me" id="me" title="Reviewer: click to change"></button>
    </aside>
    <div class="content">
      <div id="hubBanner" class="hubwarn" role="status"></div>
      <section class="tabpage" id="dashTab"><div id="dashBody"><p class="muted">Loading…</p></div></section>
      <section class="tabpage" id="queueTab" hidden>
        <div id="plistView">
          <div class="ptools"><h1>Patients</h1>
            <div class="row gap wrap"><input type="search" id="psearch" placeholder="Search name, code, area, finding" aria-label="Search patients">
              <label class="inline"><input type="checkbox" id="openOnly" checked> Open cases only</label></div></div>
          <div class="seg filters" id="pfilters"></div>
          <div class="dtable-wrap"><table class="dtable"><thead><tr><th>Patient</th><th>Age, sex</th><th>Language</th><th>Area</th><th>Urgency</th><th>Status</th><th>Review due</th></tr></thead>
            <tbody id="cases"></tbody></table></div>
          <p class="muted small" id="listMeta"></p>
        </div>
        <section class="detail" id="detail" hidden></section>
      </section>
      <section class="planning tabpage" id="planningTab" hidden></section>
      <section class="planning rules-tab tabpage" id="rulesTab" hidden></section>
    </div>
  </div>
  <script type="module" src="js/portal.js"></script>
</body>
</html>
