<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Shared document · DivyaDrishti</title>
  <meta name="description" content="An encrypted eye-care document shared with you. It expires after a few days.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    @font-face { font-family: "DM Serif Display"; src: url("fonts/DMSerifDisplay-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Plus Jakarta Sans"; src: url("fonts/PlusJakartaSans-Variable.woff2") format("woff2"); font-weight: 200 800; font-display: swap; }
    @font-face { font-family: "Geist"; src: url("fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
    :root {
      --ink: #0f1419; --ink-2: #3b434e; --muted: #6c7480; --bg: #f6f1ec; --card: #ffffff; --surface-2: #f5f6f8; --line: #e7e9ed;
      --accent: #e8622f; --accent-ink: #ffffff; --teal: #e8622f; --teal-soft: #e3f3f3; --primary: #1d1a17; --primary-ink: #fff;
      --red: #c4281f; --red-soft: #fff1f0; --green: #0a7a4b; --green-soft: #ecfaf3;
      --radius: 20px; --shadow: 0 1px 2px rgba(15, 20, 25, .04), 0 6px 20px -10px rgba(15, 20, 25, .10);
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ink: #edf0f3; --ink-2: #c3c9d1; --muted: #8b939e; --bg: #0b0e11; --card: #14181d; --surface-2: #1b2026; --line: #252b33;
        --accent: #ff8a5c; --accent-ink: #0b0e11; --teal: #ff8a5c; --teal-soft: #11292b; --primary: #edf0f3; --primary-ink: #0b0e11;
        --red: #ff8077; --red-soft: #2a1412; --green: #5fd49b; --green-soft: #0d2219; --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
      font: 18px/1.55 "Plus Jakarta Sans", "Geist", system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Tamil", "Noto Sans Devanagari",
        "Noto Sans Telugu", "Noto Sans Kannada", sans-serif;
    }
    .top { display: flex; align-items: center; gap: 10px; padding: 12px 16px; min-height: 60px; background: var(--card); border-bottom: 1px solid var(--line); color: var(--ink); font-weight: 600; font-size: 1.05rem; letter-spacing: -.02em; }
    .top svg { color: var(--accent); flex: none; }
    main { max-width: 640px; margin: 0 auto; padding: 16px 16px 48px; }
    h1 { font-size: 1.7rem; line-height: 1.15; font-weight: 700; letter-spacing: -.03em; margin: .2rem 0 .6rem; overflow-wrap: anywhere; }
    h2 { font-size: 1.08rem; font-weight: 600; margin: 1.4rem 0 .4rem; padding-top: .9rem; border-top: 1px solid var(--line); }
    p { margin: .45rem 0; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px 18px; margin: 12px 0; box-shadow: var(--shadow); }
    .muted { color: var(--muted); }
    .small { font-size: .88rem; }
    .eyebrow { font-size: .82rem; font-weight: 500; color: var(--muted); margin: 0; }
    .status { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 10px 14px; border-radius: 14px;
      background: var(--green-soft); color: var(--green); font-weight: 500; font-size: .9rem; margin: 12px 0; }
    .status.last { background: var(--red-soft); color: var(--red); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 54px; padding: .6rem 1.2rem;
      font: inherit; font-weight: 500; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 14px; cursor: pointer; }
    .btn.primary { background: var(--primary); color: var(--primary-ink); border-color: var(--primary); width: 100%; margin-top: 12px; }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn:focus-visible, input:focus, h1:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
    label { display: block; font-weight: 600; margin-top: .6rem; }
    #pin { display: block; width: 100%; margin-top: .4rem; padding: .6rem; font: inherit; font-size: 1.8rem; letter-spacing: .4em;
      text-align: center; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: 14px; font-family: ui-monospace, Menlo, Consolas, monospace; }
    .err { color: var(--red); font-weight: 600; min-height: 1.5em; }
    .error h1 { color: var(--red); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 6px; }
    .doc .line { font-size: 1.12rem; margin: .55rem 0; overflow-wrap: anywhere; }
    .doc .gap { height: .6rem; }
    .doc .para { white-space: pre-line; overflow-wrap: anywhere; }
    .doc ul { margin: .3rem 0; padding-left: 1.3rem; }
    .doc li { margin: .3rem 0; overflow-wrap: anywhere; }
    .doc dl { margin: .4rem 0; }
    .doc dt { font-size: .85rem; color: var(--muted); font-weight: 600; margin-top: .7rem; }
    .doc dd { margin: .1rem 0 0; font-size: 1.08rem; white-space: pre-line; overflow-wrap: anywhere; }
    .doc dd dl { padding-left: .8rem; border-left: 3px solid var(--line); }
    .doc .meta { display: grid; grid-template-columns: auto 1fr; gap: .2rem .8rem; margin: .6rem 0 1rem; }
    .doc .meta dt { margin: 0; font-size: .95rem; }
    .doc .meta dd { margin: 0; }
    .doc .sign { margin-top: 1.4rem; white-space: pre-line; font-weight: 600; }
    .printnote { display: none; }
    .spinner { display: inline-block; width: 1em; height: 1em; border: 3px solid var(--line); border-top-color: var(--teal);
      border-radius: 50%; animation: spin 1s linear infinite; vertical-align: -.15em; margin-right: .4em; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    @media print {
      :root { color-scheme: light; }
      * { color: #000 !important; background: transparent !important; box-shadow: none !important; }
      body { font-size: 12pt; }
      .top, .status, .actions, #pinCard, #loading, .noprint { display: none !important; }
      main { max-width: none; padding: 0; }
      .card { border: 0; padding: 0; margin: 0; }
      h2 { break-after: avoid; }
      .doc .line, .doc li, .doc dd { font-size: 12pt; }
      .printnote { display: block !important; margin-top: 1.5rem; font-size: 9pt; }
    }
  </style>
</head>
<body>
  <header class="top">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><rect width="32" height="32" rx="10" fill="currentColor"/><path d="M5.5 16c2.9-4.7 6.4-7 10.5-7s7.6 2.3 10.5 7c-2.9 4.7-6.4 7-10.5 7s-7.6-2.3-10.5-7z" fill="none" stroke="#fff" stroke-width="1.9"/><circle cx="16" cy="16" r="3.4" fill="#fff"/></svg>
    <span>DivyaDrishti</span>
  </header>
  <main>
    <section id="loading" class="card" role="status">
      <p><span class="spinner" aria-hidden="true"></span><span id="loadingText">Opening the secure document…</span></p>
    </section>

    <section id="pinCard" class="card" hidden>
      <h1 tabindex="-1">Enter the PIN</h1>
      <p>This document is locked with a PIN. The person who shared it told you the PIN.</p>
      <form id="pinForm" novalidate>
        <label for="pin">PIN (4 to 6 digits)</label>
        <input id="pin" name="pin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" required>
        <p id="pinErr" class="err" role="alert"></p>
        <button id="pinBtn" class="btn primary" type="submit">Open</button>
      </form>
    </section>

    <section id="errorCard" class="card error" hidden>
      <h1 id="errTitle" tabindex="-1"></h1>
      <p id="errText"></p>
      <button id="retryBtn" class="btn" type="button" hidden>Try again</button>
    </section>

    <p id="status" class="status" hidden></p>
    <article id="doc" class="card doc" hidden></article>
    <div id="actions" class="actions" hidden>
      <button id="printBtn" class="btn" type="button">Print</button>
    </div>
    <p id="keepNote" class="muted small noprint" hidden>Nothing is saved on this phone. To see this again, open the link again (it uses one view) or print it now.</p>
    <p class="printnote muted">Printed from an encrypted DivyaDrishti link.</p>
  </main>
  <noscript><p class="card">This secure document needs JavaScript to open.</p></noscript>
  <script type="module" src="js/share_view.js"></script>
</body>
</html>
