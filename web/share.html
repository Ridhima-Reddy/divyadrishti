<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Shared document · DivyaDrishti</title>
  <meta name="description" content="An encrypted eye-care document shared with you. It expires after a few days.">
  <meta name="theme-color" content="#14212e">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    :root {
      --ink: #14212e; --ink-2: #3a4a5a; --muted: #5f6b78; --bg: #f5f0e6; --card: #fffdf8; --line: #e3dacb;
      --accent: #d96d24; --accent-ink: #ffffff; --teal: #1d7f91; --teal-soft: #dcf0f3;
      --red: #b3261e; --red-soft: #fbe3e1; --green: #1f6f43; --green-soft: #dcefe3;
      --radius: 14px; --shadow: 0 1px 2px rgba(20, 33, 46, .06), 0 4px 14px rgba(20, 33, 46, .06);
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --ink: #eef2f5; --ink-2: #c4ccd4; --muted: #9eabb8; --bg: #0f1921; --card: #17232e; --line: #26343f;
        --accent: #f08a43; --accent-ink: #14212e; --teal: #5cc3d2; --teal-soft: #173941;
        --red: #ff8a80; --red-soft: #3d1f1d; --green: #7fd3a1; --green-soft: #1b3426; --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 19px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Tamil", "Noto Sans Devanagari",
        "Noto Sans Telugu", "Noto Sans Kannada", sans-serif;
    }
    .top { display: flex; align-items: center; gap: 8px; padding: 12px 16px; background: #14212e; color: #fff; font-weight: 700; font-size: 1.1rem; }
    .top svg { color: #f08a43; flex: none; }
    main { max-width: 640px; margin: 0 auto; padding: 12px 16px 48px; }
    h1 { font-size: 1.6rem; line-height: 1.25; margin: .2rem 0 .6rem; overflow-wrap: anywhere; }
    h2 { font-size: 1.15rem; margin: 1.4rem 0 .4rem; padding-top: .8rem; border-top: 1px solid var(--line); }
    p { margin: .45rem 0; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 16px; margin: 12px 0; box-shadow: var(--shadow); }
    .muted { color: var(--muted); }
    .small { font-size: .9rem; }
    .eyebrow { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 700; margin: 0; }
    .status { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 10px 14px; border-radius: 12px;
      background: var(--green-soft); color: var(--green); font-weight: 600; font-size: .95rem; margin: 12px 0; }
    .status.last { background: var(--red-soft); color: var(--red); }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 56px; padding: .6rem 1.2rem;
      font: inherit; font-weight: 700; color: var(--ink); background: var(--card); border: 1.5px solid var(--line);
      border-radius: 12px; cursor: pointer; }
    .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); width: 100%; margin-top: 12px; }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn:focus-visible, input:focus, h1:focus-visible { outline: 3px solid var(--teal); outline-offset: 2px; }
    label { display: block; font-weight: 600; margin-top: .6rem; }
    #pin { display: block; width: 100%; margin-top: .4rem; padding: .6rem; font: inherit; font-size: 1.8rem; letter-spacing: .4em;
      text-align: center; color: var(--ink); background: var(--bg); border: 2px solid var(--line); border-radius: 12px; }
    .err { color: var(--red); font-weight: 600; min-height: 1.5em; }
    .error h1 { color: var(--red); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 6px; }
    .doc .line { font-size: 1.12rem; margin: .55rem 0; overflow-wrap: anywhere; }
    .doc .gap { height: .6rem; }
    .doc .para { white-space: pre-line; overflow-wrap: anywhere; }
    .doc ul { margin: .3rem 0; padding-left: 1.3rem; }
    .doc li { margin: .3rem 0; overflow-wrap: anywhere; }
    .doc dl { margin: .4rem 0; }
    .doc dt { font-size: .85rem; color: var(--muted); font-weight: 600; margin-top: .7rem; }
    .doc dd { margin: .1rem 0 0; font-size: 1.08rem; white-space: pre-line; overflow-wrap: anywhere; }
    .doc dd dl { padding-left: .8rem; border-left: 3px solid var(--line); }
    .doc .meta { display: grid; grid-template-columns: auto 1fr; gap: .2rem .8rem; margin: .6rem 0 1rem; }
    .doc .meta dt { margin: 0; font-size: .95rem; }
    .doc .meta dd { margin: 0; }
    .doc .sign { margin-top: 1.4rem; white-space: pre-line; font-weight: 600; }
    .printnote { display: none; }
    .spinner { display: inline-block; width: 1em; height: 1em; border: 3px solid var(--line); border-top-color: var(--teal);
      border-radius: 50%; animation: spin 1s linear infinite; vertical-align: -.15em; margin-right: .4em; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
    @media print {
      :root { color-scheme: light; }
      * { color: #000 !important; background: transparent !important; box-shadow: none !important; }
      body { font-size: 12pt; }
      .top, .status, .actions, #pinCard, #loading, .noprint { display: none !important; }
      main { max-width: none; padding: 0; }
      .card { border: 0; padding: 0; margin: 0; }
      h2 { break-after: avoid; }
      .doc .line, .doc li, .doc dd { font-size: 12pt; }
      .printnote { display: block !important; margin-top: 1.5rem; font-size: 9pt; }
    }
  </style>
</head>
<body>
  <header class="top">
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><path d="M26.4 11.2A11.5 11.5 0 1 0 26.4 20.8" fill="none" stroke="currentColor" stroke-width="5.5"/></svg>
    <span>DivyaDrishti</span>
  </header>
  <main>
    <section id="loading" class="card" role="status">
      <p><span class="spinner" aria-hidden="true"></span><span id="loadingText">Opening the secure document…</span></p>
    </section>

    <section id="pinCard" class="card" hidden>
      <h1 tabindex="-1">Enter the PIN</h1>
      <p>This document is locked with a PIN. The person who shared it told you the PIN.</p>
      <form id="pinForm" novalidate>
        <label for="pin">PIN (4 to 6 digits)</label>
        <input id="pin" name="pin" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="off" required>
        <p id="pinErr" class="err" role="alert"></p>
        <button id="pinBtn" class="btn primary" type="submit">Open</button>
      </form>
    </section>

    <section id="errorCard" class="card error" hidden>
      <h1 id="errTitle" tabindex="-1"></h1>
      <p id="errText"></p>
      <button id="retryBtn" class="btn" type="button" hidden>Try again</button>
    </section>

    <p id="status" class="status" hidden></p>
    <article id="doc" class="card doc" hidden></article>
    <div id="actions" class="actions" hidden>
      <button id="printBtn" class="btn" type="button">🖨️ Print</button>
    </div>
    <p id="keepNote" class="muted small noprint" hidden>Nothing is saved on this phone. To see this again, open the link again (it uses one view) or print it now.</p>
    <p class="printnote muted">Printed from an encrypted DivyaDrishti link.</p>
  </main>
  <noscript><p class="card">This secure document needs JavaScript to open.</p></noscript>
  <script type="module" src="js/share_view.js"></script>
</body>
</html>
