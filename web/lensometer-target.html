<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Lensometry Target</title>
  <meta name="description" content="Black and white checkerboard for measuring spectacle power with the DivyaDrishti phone camera.">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <style>
    /* The pattern is always pure black on white, whatever the system theme. */
    :root { color-scheme: light; --ink: #0f1419; --accent: #e8622f; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #fff; overflow: hidden; }
    body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif; color: var(--ink); }

    /* Screen: a canvas drawn in whole device pixels (sharp edges, no seams). */
    #board { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    /* Fallback without JavaScript, and the print version: an SVG pattern. */
    #paper { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    .has-canvas #paper { display: none; }
    html:not(.has-canvas) #board { display: none; }

    .caption {
      position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%);
      width: min(520px, calc(100% - 32px)); padding: 12px 14px 12px 16px;
      background: #fff; color: var(--ink); border: 2px solid var(--ink); border-radius: 14px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, .25);
      display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: start;
    }
    .caption[hidden] { display: none; }
    .caption p { margin: 0; }
    .caption .lead { font-weight: 600; }
    .caption .meta { grid-column: 1; font-size: 13px; color: #3a4a5a; }
    .caption .actions { grid-column: 2; grid-row: 1 / span 2; display: flex; gap: 6px; }
    .caption button {
      font: inherit; font-size: 14px; min-height: 40px; padding: 0 12px; border-radius: 10px; cursor: pointer;
      border: 1.5px solid var(--ink); background: #fff; color: var(--ink);
    }
    .caption button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .caption button.close { width: 40px; padding: 0; font-size: 22px; line-height: 1; }
    .caption button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 420px) {
      .caption { grid-template-columns: 1fr; }
      .caption .actions { grid-column: 1; grid-row: auto; }
    }

    .print-label { display: none; }

    @media print {
      @page { margin: 8mm; }
      html, body { overflow: visible; background: #fff; }
      #board, .caption { display: none !important; }
      .has-canvas #paper, #paper { display: block; }
      .print-label {
        display: block; position: fixed; left: 0; bottom: 0; margin: 0; padding: 1mm 2mm;
        background: #fff; color: #000; font-size: 8pt;
      }
    }
  </style>
</head>
<body>
  <canvas id="board" aria-label="Black and white checkerboard target"></canvas>
  <svg id="paper" aria-hidden="true">
    <defs>
      <!-- one tile = 2 × 2 squares; user units are CSS px (96 per inch), so 4 mm = 15.118 -->
      <pattern id="checks" patternUnits="userSpaceOnUse" width="30.236" height="30.236">
        <rect width="15.118" height="15.118" fill="#000"></rect>
        <rect x="15.118" y="15.118" width="15.118" height="15.118" fill="#000"></rect>
      </pattern>
    </defs>
    <rect width="100%" height="100%" fill="#fff"></rect>
    <rect width="100%" height="100%" fill="url(#checks)"></rect>
  </svg>

  <div class="caption" id="caption" role="note">
    <p class="lead">Hold the phone 40 cm from this screen, glasses halfway, lens over part of the pattern.</p>
    <p class="meta" id="meta">4 mm squares. Keep the screen square to the phone. Print this page for a paper target.</p>
    <div class="actions">
      <button type="button" class="primary" id="fullscreen" hidden>Full screen</button>
      <button type="button" class="close" id="hide" aria-label="Hide this note" title="Hide (Esc). Press H to show again.">×</button>
    </div>
  </div>

  <p class="print-label" id="printLabel">DivyaDrishti lensometry target · 4 mm squares · phone 40 cm from the paper, glasses halfway</p>

  <script type="module" src="js/lensometer_target.js"></script>
</body>
</html>
